name: Build and publish Beetdrop image

# push paths are deliberately unfiltered: combining a paths filter with
# tag triggers silently skips tag builds, and nearly every commit here
# touches the app anyway.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - 'beetdrop/**'
      - 'requirements.txt'
      - '.github/workflows/publish-docker.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/beetdrop

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v

  publish:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: |
          VERSION=$(sed -n 's/^__version__ = "\([^"]*\)".*/\1/p' beetdrop/__init__.py | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Set up QEMU (arm builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
          labels: |
            org.opencontainers.image.title=Beetdrop
            org.opencontainers.image.description=Search YouTube Music and drop seed-tagged audio into a beets-flask inbox

      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: beetdrop:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          mkdir -p "$RUNNER_TEMP/inbox"
          docker run -d --name beetdrop-smoke -p 8090:8090 \
            -v "$RUNNER_TEMP/inbox:/inbox" \
            -e PUID=$(id -u) -e PGID=$(id -g) \
            beetdrop:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8090/api/health > health.json 2>/dev/null; then
              break
            fi
            sleep 1
          done
          cat health.json
          grep -q '"status": *"ok"' health.json || { docker logs beetdrop-smoke; exit 1; }
          grep -q '"inbox_writable": *true' health.json || { docker logs beetdrop-smoke; exit 1; }
          docker rm -f beetdrop-smoke

      - name: Build and push multi-arch
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
