# Beetdrop
#
# The /inbox volume must resolve to the same folder beets-flask watches;
# both containers see the same path. Set PUID/PGID to the user that owns
# that share so beets and the host can read what Beetdrop writes.
#
#   docker compose up -d
#   docker compose logs -f beetdrop

services:
  beetdrop:
    image: ghcr.io/breezyslasher/beetdrop:latest
    container_name: beetdrop
    restart: unless-stopped

    ports:
      # host:container. If the host port is already allocated ("Bind for
      # 0.0.0.0:8090 failed"), change only the left side, e.g. "8091:8090",
      # and browse to that port instead. The container side stays 8090.
      - "8090:8090"

    volumes:
      # Persistent state: settings, job history (SQLite)
      - ./config:/config
      # beets-flask inbox - point this at the SAME host folder beets-flask
      # watches, e.g. /srv/dev-disk-by-uuid-XXXX/Media/inbox
      - ./inbox:/inbox
      # Library mode: mount your music library and set the filing mode to
      # "library" in Settings - Beetdrop then tags via MusicBrainz and
      # files straight here, no beets needed.
      # - /srv/dev-disk-by-uuid-XXXX/Media/Music/explo:/music
      # Optional: cookies for throttled or region-locked content
      # - ./config/cookies.txt:/config/cookies.txt:ro

    environment:
      # User/group that owns the inbox share
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - INBOX_PATH=/inbox

      # Optional: refresh yt-dlp on every container start. Worth enabling
      # when grabs start failing en masse after a YouTube change.
      # - BEETDROP_SELFUPDATE=1

      # Optional: default output format (opus, m4a, mp3) and mp3 bitrate;
      # both can also be changed at runtime in Settings.
      # - BEETDROP_FORMAT=opus
      # - BEETDROP_BITRATE=192

      # Optional: single shared password for the API/UI
      # - BEETDROP_PASSWORD=changeme

      # Optional: cookies file (mount it above as well)
      # - BEETDROP_COOKIES=/config/cookies.txt

    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
